<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portfólio Essência - Vida Prática 40+</title>
    <style>
        :root {
            --bege-linho: #f5f5f0;
            --marrom-cafe: #3e2723;
            --terracota: #a0522d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bege-linho);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; 
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Container do Portfólio Ocupando 90% da Tela */
        .portfolio-container {
            position: relative;
            width: 95%; 
            height: 90vh; 
            max-width: 506px; 
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            overflow: hidden;
        }

        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            /* Transição tornada mais lenta: 1.5s para opacidade e 2s para o zoom */
            transition: opacity 1.5s cubic-bezier(0.4, 0, 0.2, 1), transform 2s cubic-bezier(0.2, 0, 0.2, 1);
            transform: scale(1.15); 
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }

        .slide.active {
            opacity: 1;
            transform: scale(1);
            z-index: 2;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
        }

        /* Contador */
        .counter {
            position: absolute;
            top: 25px;
            right: 25px;
            color: #fff; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            font-size: 0.85rem;
            font-weight: 300;
            letter-spacing: 2px;
            z-index: 10;
        }

        /* Controles de Navegação */
        .controls {
            position: absolute;
            bottom: 40px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            z-index: 10;
        }

        .btn {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.4rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active {
            transform: scale(0.9);
            background: var(--marrom-cafe);
        }

        .overlay-bottom {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 150px;
            background: linear-gradient(to top, rgba(0,0,0,0.4), transparent);
            z-index: 5;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="portfolio-container">
        <div class="counter" id="counter">01 / 13</div>
        <div class="overlay-bottom"></div>
        
        <div class="slide active"><img src="01.png" alt="Perfume 1"></div>
        <div class="slide"><img src="03.png" alt="Perfume 2"></div>
        <div class="slide"><img src="04.png" alt="Perfume 3"></div>
        <div class="slide"><img src="05.png" alt="Perfume 4"></div>
        <div class="slide"><img src="06.png" alt="Perfume 5"></div>
        <div class="slide"><img src="07.png" alt="Perfume 6"></div>
        <div class="slide"><img src="08.png" alt="Perfume 7"></div>
        <div class="slide"><img src="09.png" alt="Perfume 8"></div>
        <div class="slide"><img src="10.png" alt="Perfume 9"></div>
        <div class="slide"><img src="11.png" alt="Perfume 10"></div>
        <div class="slide"><img src="12.png" alt="Perfume 11"></div>
        <div class="slide"><img src="13.png" alt="Perfume 12"></div>
        <div class="slide"><img src="14.png" alt="Perfume 13"></div>

        <div class="controls">
            <div class="btn" onclick="changeSlide(-1)">&#10229;</div>
            <div class="btn" onclick="changeSlide(1)">&#10230;</div>
        </div>
    </div>

    <script>
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        const counter = document.getElementById('counter');

        function changeSlide(direction) {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + direction + slides.length) % slides.length;
            slides[currentSlide].classList.add('active');
            
            const displayNum = (currentSlide + 1).toString().padStart(2, '0');
            counter.innerText = `${displayNum} / 13`;
        }

        let touchstartX = 0;
        let touchendX = 0;
        const container = document.querySelector('.portfolio-container');
        
        container.addEventListener('touchstart', e => {
            touchstartX = e.changedTouches[0].screenX;
        }, {passive: true});

        container.addEventListener('touchend', e => {
            touchendX = e.changedTouches[0].screenX;
            handleGesture();
        }, {passive: true});

        function handleGesture() {
            if (touchstartX - touchendX > 50) changeSlide(1);
            if (touchendX - touchstartX > 50) changeSlide(-1);
        }
    </script>
</body>
</html>
