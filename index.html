<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio Essência - Vida Prática 40+</title>
    <style>
        :root {
            --bege-linho: #f5f5f0;
            --marrom-cafe: #3e2723;
            --terracota: #a0522d;
            --overlay: rgba(62, 39, 35, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bege-linho);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; /* Evita scroll lateral no mobile */
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Container do Portfólio */
        .portfolio-container {
            position: relative;
            width: 90%;
            max-width: 400px; /* Formato ideal para smartphone */
            height: 75vh;
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), transform 1.2s ease;
            transform: scale(1.05);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .slide.active {
            opacity: 1;
            transform: scale(1);
            z-index: 1;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Garante que a foto do perfume preencha o espaço */
        }

        /* Controles Super Elegantes */
        .controls {
            position: absolute;
            bottom: 30px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 40px;
            z-index: 10;
        }

        .btn {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(62, 39, 35, 0.3);
            color: var(--marrom-cafe);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.2rem;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active {
            transform: scale(0.9);
            background: var(--marrom-cafe);
            color: #fff;
        }

        .counter {
            position: absolute;
            top: 20px;
            right: 20px;
            color: var(--marrom-cafe);
            font-size: 0.8rem;
            letter-spacing: 2px;
            z-index: 10;
        }

        /* Rodapé com Slogan */
        .footer-brand {
            margin-top: 20px;
            text-align: center;
            color: var(--marrom-cafe);
        }

        .footer-brand p {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div class="portfolio-container">
        <div class="counter" id="counter">01 / 13</div>
        
        <div class="slide active"><img src="01.png" alt="Milliard 1"></div>
        <div class="slide"><img src="03.png" alt="Milliard 2"></div>
        <div class="slide"><img src="04.png" alt="Milliard 3"></div>
        <div class="slide"><img src="05.png" alt="Milliard 4"></div>
        <div class="slide"><img src="06.png" alt="Milliard 5"></div>
        <div class="slide"><img src="07.png" alt="Milliard 6"></div>
        <div class="slide"><img src="08.png" alt="Milliard 7"></div>
        <div class="slide"><img src="09.png" alt="Milliard 8"></div>
        <div class="slide"><img src="10.png" alt="Milliard 9"></div>
        <div class="slide"><img src="11.png" alt="Milliard 10"></div>
        <div class="slide"><img src="12.png" alt="Milliard 11"></div>
        <div class="slide"><img src="13.png" alt="Milliard 12"></div>
        <div class="slide"><img src="14.png" alt="Milliard 13"></div>

        <div class="controls">
            <div class="btn" onclick="changeSlide(-1)">&#10229;</div>
            <div class="btn" onclick="changeSlide(1)">&#10230;</div>
        </div>
    </div>

    <div class="footer-brand">
        <p>Soluções inteligentes para quem valoriza o tempo</p>
    </div>

    <script>
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        const counter = document.getElementById('counter');

        function changeSlide(direction) {
            // Remove classe ativa do slide atual
            slides[currentSlide].classList.remove('active');

            // Calcula o próximo slide (loop infinito)
            currentSlide = (currentSlide + direction + slides.length) % slides.length;

            // Adiciona classe ativa ao novo slide
            slides[currentSlide].classList.add('active');

            // Atualiza o contador
            const displayNum = (currentSlide + 1).toString().padStart(2, '0');
            counter.innerText = `${displayNum} / 13`;
        }

        // Suporte para Swipe (deslizar o dedo)
        let touchstartX = 0;
        let touchendX = 0;
        
        document.querySelector('.portfolio-container').addEventListener('touchstart', e => {
            touchstartX = e.changedTouches[0].screenX;
        });

        document.querySelector('.portfolio-container').addEventListener('touchend', e => {
            touchendX = e.changedTouches[0].screenX;
            if (touchstartX - touchendX > 50) changeSlide(1);
            if (touchendX - touchstartX > 50) changeSlide(-1);
        });
    </script>
</body>
</html>
