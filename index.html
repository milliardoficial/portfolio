<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Portfólio Milliard</title>
    <style>
        :root {
            --terracota: #a0522d;
        }

        /* Reset agressivo para evitar margens fantasmas */
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-font-smoothing: antialiased;
        }

        html, body {
            width: 100%;
            /* Uso de dvh para evitar cortes causados pelas barras dos navegadores mobile */
            height: 100dvh; 
            overflow: hidden;
            background-color: #000;
            position: fixed; /* Evita o "pulo" da tela no Safari */
        }

        .portfolio-container {
            position: relative;
            width: 100%;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
        }

        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1.5s cubic-bezier(0.4, 0, 0.2, 1), transform 2s cubic-bezier(0.2, 0, 0.2, 1);
            transform: scale(1.1); 
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
            pointer-events: none;
        }

        .slide.active {
            opacity: 1;
            transform: scale(1);
            z-index: 2;
            pointer-events: auto;
        }

        .slide img {
            /* Garante que a imagem ocupe o máximo possível sem nunca vazar da tela */
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
        }

        /* Controles Laterais */
        .controls {
            position: absolute;
            top: 50%;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 10px;
            transform: translateY(-50%);
            z-index: 10;
            pointer-events: none;
        }

        .btn {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 0.5s ease, transform 0.3s ease;
            font-size: 1.1rem;
            pointer-events: auto;
            -webkit-tap-highlight-color: transparent;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .btn.hidden { opacity: 0; pointer-events: none; }

        /* CTA WhatsApp Estilizado */
        .cta-whatsapp {
            position: absolute;
            bottom: calc(30px + env(safe-area-inset-bottom)); /* Respeita a barra do iPhone */
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background-color: var(--terracota);
            color: white;
            padding: 16px 32px;
            border-radius: 40px;
            text-decoration: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            z-index: 20;
            white-space: nowrap;
        }

        .cta-whatsapp.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(-50%) translateY(0);
        }

        .vignette {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 60%, rgba(0,0,0,0.5) 100%);
            z-index: 5;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="portfolio-container">
        <div class="vignette"></div>
        
        <div class="slide active"><img src="01.png" alt="Milliard 1"></div>
        <div class="slide"><img src="03.png" alt="Milliard 2"></div>
        <div class="slide"><img src="04.png" alt="Milliard 3"></div>
        <div class="slide"><img src="05.png" alt="Milliard 4"></div>
        <div class="slide"><img src="06.png" alt="Milliard 5"></div>
        <div class="slide"><img src="07.png" alt="Milliard 6"></div>
        <div class="slide"><img src="08.png" alt="Milliard 7"></div>
        <div class="slide"><img src="09.png" alt="Milliard 8"></div>
        <div class="slide"><img src="10.png" alt="Milliard 9"></div>
        <div class="slide"><img src="11.png" alt="Milliard 10"></div>
        <div class="slide"><img src="12.png" alt="Milliard 11"></div>
        <div class="slide"><img src="13.png" alt="Milliard 12"></div>
        <div class="slide"><img src="14.png" alt="Milliard 13"></div>

       <a href="https://wa.me/5511910221415?text=Olá! Conheci o portfólio Milliard e gostaria de mais informações." 
           class="cta-whatsapp" id="whatsapp-btn" target="_blank">
            FALAR COM CONSULTOR
        </a>

        <div class="controls">
            <div id="btn-prev" class="btn hidden" onclick="changeSlide(-1)">&#10229;</div>
            <div id="btn-next" class="btn" onclick="changeSlide(1)">&#10230;</div>
        </div>
    </div>

    <script>
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const whatsappBtn = document.getElementById('whatsapp-btn');

        function preloadImages() {
            slides.forEach(slide => {
                const img = slide.querySelector('img');
                const cacheImg = new Image();
                cacheImg.src = img.src;
            });
        }

        function changeSlide(direction) {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + direction + slides.length) % slides.length;
            slides[currentSlide].classList.add('active');

            // Visibilidade do botão Voltar
            if (currentSlide === 0) {
                btnPrev.classList.add('hidden');
            } else {
                btnPrev.classList.remove('hidden');
            }

            // Lógica do Botão WhatsApp (Última imagem)
            if (currentSlide === slides.length - 1) {
                whatsappBtn.classList.add('visible');
                btnNext.classList.add('hidden');
            } else {
                whatsappBtn.classList.remove('visible');
                btnNext.classList.remove('hidden');
            }
        }

        // Suporte para Swipe
        let touchstartX = 0;
        const container = document.querySelector('.portfolio-container');
        
        container.addEventListener('touchstart', e => {
            touchstartX = e.changedTouches[0].screenX;
        }, {passive: true});

        container.addEventListener('touchend', e => {
            let touchendX = e.changedTouches[0].screenX;
            if (touchstartX - touchendX > 50) changeSlide(1);
            if (touchendX - touchstartX > 50) changeSlide(-1);
        }, {passive: true});

        window.onload = preloadImages;
    </script>
</body>
</html>
