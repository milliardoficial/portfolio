<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portfólio Essência - Vida Prática 40+</title>
    <style>
        :root {
            --bege-linho: #f5f5f0;
            --marrom-cafe: #3e2723;
        }

        /* Reset total para ocupação de 100% da tela */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000; /* Fundo preto evita flashes brancos entre transições */
        }

        /* Container ocupando toda a tela do celular */
        .portfolio-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1.5s cubic-bezier(0.4, 0, 0.2, 1), transform 2s cubic-bezier(0.2, 0, 0.2, 1);
            transform: scale(1.1); 
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }

        .slide.active {
            opacity: 1;
            transform: scale(1);
            z-index: 2;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Força o preenchimento total */
        }

        /* Contador no topo */
        .counter {
            position: absolute;
            top: env(safe-area-inset-top, 20px); /* Respeita o notch do iPhone */
            right: 20px;
            color: #fff; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            font-size: 0.9rem;
            font-weight: 300;
            letter-spacing: 2px;
            z-index: 10;
        }

        /* Controles Laterais no Meio da Tela */
        .controls {
            position: absolute;
            top: 50%;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 15px;
            transform: translateY(-50%);
            z-index: 10;
            pointer-events: none; /* Permite que o clique passe para a imagem se necessário */
        }

        .btn {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.2rem;
            pointer-events: auto; /* Reativa o clique apenas nos botões */
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active {
            transform: scale(0.85);
            background: rgba(255, 255, 255, 0.3);
        }

        /* Overlay sutil para legibilidade */
        .vignette-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 60%, rgba(0,0,0,0.3) 100%);
            z-index: 5;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="portfolio-container">
        <div class="counter" id="counter">01 / 13</div>
        <div class="vignette-overlay"></div>
        
        <div class="slide active"><img src="01.png" alt="Perfume 1"></div>
        <div class="slide"><img src="03.png" alt="Perfume 2"></div>
        <div class="slide"><img src="04.png" alt="Perfume 3"></div>
        <div class="slide"><img src="05.png" alt="Perfume 4"></div>
        <div class="slide"><img src="06.png" alt="Perfume 5"></div>
        <div class="slide"><img src="07.png" alt="Perfume 6"></div>
        <div class="slide"><img src="08.png" alt="Perfume 7"></div>
        <div class="slide"><img src="09.png" alt="Perfume 8"></div>
        <div class="slide"><img src="10.png" alt="Perfume 9"></div>
        <div class="slide"><img src="11.png" alt="Perfume 10"></div>
        <div class="slide"><img src="12.png" alt="Perfume 11"></div>
        <div class="slide"><img src="13.png" alt="Perfume 12"></div>
        <div class="slide"><img src="14.png" alt="Perfume 13"></div>

        <div class="controls">
            <div class="btn" onclick="changeSlide(-1)">&#10229;</div>
            <div class="btn" onclick="changeSlide(1)">&#10230;</div>
        </div>
    </div>

    <script>
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        const counter = document.getElementById('counter');

        function changeSlide(direction) {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + direction + slides.length) % slides.length;
            slides[currentSlide].classList.add('active');
            
            const displayNum = (currentSlide + 1).toString().padStart(2, '0');
            counter.innerText = `${displayNum} / 13`;
        }

        // Suporte para Swipe (arrastar)
        let touchstartX = 0;
        let touchendX = 0;
        const container = document.querySelector('.portfolio-container');
        
        container.addEventListener('touchstart', e => {
            touchstartX = e.changedTouches[0].screenX;
        }, {passive: true});

        container.addEventListener('touchend', e => {
            touchendX = e.changedTouches[0].screenX;
            if (touchstartX - touchendX > 50) changeSlide(1);
            if (touchendX - touchstartX > 50) changeSlide(-1);
        }, {passive: true});
    </script>
</body>
</html>
